<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crucible</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-container">
            <h1 class="company-name">Crucible</h1>
            <p class="dynamic-quote" id="header-quote">Hack the planet, ethically.</p>
        </div>
    </header>

            <!-- Back Button -->
    <div class="back-button-container">
        <button class="back-button" onclick="history.back()">← Back</button>
    </div>

    <!-- Chapters Section -->
    <main id="chapters-container">
        <!-- Each chapter with heading + cards will be injected here -->
    </main>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content" id="modal-content">
            <span id="modal-close">&times;</span>
        </div>
    </div>

            <!-- Back Button -->
    <div class="back-button-container">
        <button class="back-button" onclick="history.back()">← Back</button>
    </div>

    <!-- Footer -->
    <footer>
        <p id="footer-quote">"Stay safe, stay cyber-aware."</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
